<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RUP - Presenze</title>

  <!-- PWA per Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22334C">

  <!-- PWA per iPhone (Icona e Schermo Intero) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RUP Presenze">
  <link rel="apple-touch-icon" href="icona-192.jpg">

  <style>
    :root {
      --primary: #22334C;       /* Blu ardesia RUP */
      --accent: #EA5B39;        /* Terracotta Preziosina */
      --bg: #F4F6F9;
      --card: #FFFFFF;
      --text: #22334C;
      --green: #2E7D32;
      --red: #C62828;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    
    .header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 24px 16px 20px;
      border-bottom: 3.5px solid var(--accent);
    }
    .header h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.5px; }
    .header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.85; }

    .container { flex: 1; padding: 20px 16px; max-width: 420px; margin: 0 auto; width: 100%; }
    .card { background: var(--card); border-radius: 12px; padding: 22px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
    input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #DCE2E6;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #FAFAFA;
      box-sizing: border-box;
    }
    input:focus { outline: none; border-color: var(--primary); background: #FFF; }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(34, 51, 76, 0.2);
      transition: background 0.2s;
    }
    .btn-submit:active { transform: scale(0.98); }

    .user-badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #EBF1F6;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
    }
    .user-room { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
    .user-name { font-size: 0.9rem; color: #555; margin-top: 2px; }
    .btn-change { font-size: 0.75rem; color: #777; background: none; border: none; cursor: pointer; text-decoration: underline; }

    .feedback { text-align: center; margin-top: 15px; font-weight: 600; font-size: 0.9rem; display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>RESIDENZA UNIVERSITARIA PREZIOSINA</h1>
    <p>Comunicazione Assenze</p>
  </div>

  <div class="container">
    <div class="card">
      
      <!-- 1. SEZIONE ACCESSO RESIDENTE (Mostrata solo al primo avvio) -->
      <div id="loginSection">
        <h3 style="margin-top:0; font-size:1.1rem; color:var(--primary);">Accesso Residente</h3>
        <p style="font-size:0.85rem; color:#666; margin-bottom:18px;">Inserisci la tua camera e i tuoi dati per memorizzare il profilo sul telefono.</p>
        
        <div class="form-group">
          <label>Numero Stanza</label>
          <input type="text" id="loginStanza" placeholder="Es. 104" required>
        </div>
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="loginNome" placeholder="Es. Mario" required>
        </div>
        <div class="form-group">
          <label>Cognome</label>
          <input type="text" id="loginCognome" placeholder="Es. Rossi" required>
        </div>
        
        <button class="btn-submit" onclick="eseguiLogin()">Accedi</button>
        <div class="feedback" id="loginFeedback"></div>
      </div>

      <!-- 2. SEZIONE MODULO ASSENZE (Mostrata se già loggato) -->
      <div id="absenceSection" style="display:none;">
        <div class="user-badge">
          <div>
            <div class="user-room" id="displayStanza">Stanza 104</div>
            <div class="user-name" id="displayNome">Mario Rossi</div>
          </div>
          <button class="btn-change" onclick="cambiaUtente()">Esci</button>
        </div>

        <form id="absenceForm" onsubmit="inviaAssenza(event)">
          <div class="form-group">
            <label>Inizio Assenza (Data e Ora Uscita)</label>
            <input type="datetime-local" id="dataInizio" required>
          </div>
          <div class="form-group">
            <label>Fine Assenza (Rientro Previsto)</label>
            <input type="datetime-local" id="dataFine" required>
          </div>
          <button type="submit" class="btn-submit" id="btnInvia">Registra Assenza</button>
        </form>
        <div class="feedback" id="formFeedback"></div>
      </div>

    </div>
  </div>

  <script>
    // INCOLLA QUI L'URL DELLA TUA WEB APP GOOGLE APPS SCRIPT
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxD2qXrTVZg8Le0wm0iHF12iKF4tj4nb5rbavZScA6gB5dOHLJ0sgzSqlxe5e8DqPnNcA/exec";

    // Controlla se il residente è già loggato sul telefono
    window.onload = function() {
      const savedStanza = localStorage.getItem("rup_stanza");
      const savedNome = localStorage.getItem("rup_nome");
      const savedCognome = localStorage.getItem("rup_cognome");
      if (savedStanza && savedNome && savedCognome) {
        mostraSchermataAssenze(savedStanza, savedNome, savedCognome);
      }
    };

    function eseguiLogin() {
      const stanza = document.getElementById("loginStanza").value.trim();
      const nome = document.getElementById("loginNome").value.trim();
      const cognome = document.getElementById("loginCognome").value.trim();
      const fb = document.getElementById("loginFeedback");

      if (!stanza || !nome || !cognome) {
        fb.style.display = "block";
        fb.style.color = "var(--red)";
        fb.innerText = "Compila tutti i campi: Stanza, Nome e Cognome.";
        return;
      }

      // Salva nel telefono
      localStorage.setItem("rup_stanza", stanza);
      localStorage.setItem("rup_nome", nome);
      localStorage.setItem("rup_cognome", cognome);
      mostraSchermataAssenze(stanza, nome, cognome);
    }

    function mostraSchermataAssenze(stanza, nome, cognome) {
      document.getElementById("loginSection").style.display = "none";
      document.getElementById("absenceSection").style.display = "block";
      document.getElementById("displayStanza").innerText = "Stanza " + stanza;
      document.getElementById("displayNome").innerText = nome + " " + cognome;
    }

    function cambiaUtente() {
      if (confirm("Vuoi disconnettere questo profilo dal telefono?")) {
        localStorage.removeItem("rup_stanza");
        localStorage.removeItem("rup_nome");
        localStorage.removeItem("rup_cognome");
        location.reload();
      }
    }

    async function inviaAssenza(e) {
      e.preventDefault();
      const btn = document.getElementById("btnInvia");
      const fb = document.getElementById("formFeedback");

      const payload = {
        action: "segnalaAssenza",
        stanza: localStorage.getItem("rup_stanza"),
        nome: localStorage.getItem("rup_nome"),
        cognome: localStorage.getItem("rup_cognome"),
        inizio: document.getElementById("dataInizio").value,
        fine: document.getElementById("dataFine").value
      };

      btn.disabled = true;
      btn.innerText = "Invio in corso...";
      fb.style.display = "none";

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(payload),
          headers: { "Content-Type": "application/json" }
        });

        fb.style.display = "block";
        fb.style.color = "var(--green)";
        fb.innerText = "✓ Assenza registrata correttamente!";
        document.getElementById("absenceForm").reset();
      } catch (err) {
        fb.style.display = "block";
        fb.style.color = "var(--red)";
        fb.innerText = "Errore durante l'invio. Riprova.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Registra Assenza";
      }
    }
  </script>
</body>
</html>
